<svg width="1200" height="650" viewBox="0 0 1200 650"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071a35"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Blue Glow -->
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Purple Glow -->
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Green Glow -->
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#1e40af"
            stroke-opacity="0.15"
            stroke-width="1"/>
    </pattern>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="650" rx="35"
        fill="url(#bg)"/>

  <rect width="1200" height="650" rx="35"
        fill="url(#grid)"/>


  <!-- Ambient Glows -->

  <circle cx="100" cy="100" r="180"
          fill="#0066ff"
          opacity="0.08"
          filter="url(#glowBlue)"/>

  <circle cx="1100" cy="550" r="200"
          fill="#7c3aed"
          opacity="0.08"
          filter="url(#glowPurple)"/>


  <!-- HEADER -->

  <rect x="45" y="35"
        width="1110"
        height="150"
        rx="25"
        fill="#06142c"
        stroke="#0ea5e9"
        stroke-width="2"
        opacity="0.95"/>


  <!-- Laptop Icon -->

  <g transform="translate(90 75)">

    <rect x="0" y="0"
          width="100"
          height="70"
          rx="8"
          fill="#0ea5e9"
          opacity="0.9"/>

    <rect x="8" y="8"
          width="84"
          height="54"
          rx="4"
          fill="#071a35"/>

    <path d="M-15 75 H115 L130 90 H-30 Z"
          fill="#38bdf8"/>

    <circle cx="50" cy="35"
            r="8"
            fill="#22d3ee"/>

  </g>


  <!-- HEADER TEXT -->

  <text x="240" y="95"
        fill="white"
        font-size="42"
        font-family="Arial, sans-serif"
        font-weight="700">

    Operating Systems

  </text>

  <text x="690" y="95"
        fill="#22d3ee"
        font-size="42"
        font-family="Arial, sans-serif"
        font-weight="700">

    — IT303

  </text>

  <text x="242" y="135"
        fill="#94a3b8"
        font-size="18"
        font-family="Arial, sans-serif">

    Learn • Understand • Build the Foundation

  </text>


  <!-- LINUX TERMINAL -->

  <g transform="translate(900 55)">

    <rect width="210"
          height="95"
          rx="15"
          fill="#020617"
          stroke="#2563eb"
          stroke-width="2"/>

    <text x="25" y="38"
          fill="#22d3ee"
          font-size="17"
          font-family="monospace">

      $ systemctl status

    </text>

    <text x="25" y="65"
          fill="#22c55e"
          font-size="15"
          font-family="monospace">

      ● system running

    </text>

    <text x="25" y="86"
          fill="#64748b"
          font-size="13"
          font-family="monospace">

      IT303_KERNEL

    </text>

  </g>


  <!-- CARDS -->


  <!-- TASKS -->

  <g>

    <rect x="60" y="230"
          width="330"
          height="260"
          rx="25"
          fill="#07162d"
          stroke="#00c6ff"
          stroke-width="2"
          filter="url(#glowBlue)"/>

    <!-- Icon -->

    <circle cx="105"
            cy="275"
            r="28"
            fill="#00c6ff"
            opacity="0.15"/>

    <text x="85"
          y="285"
          font-size="28">

      📋

    </text>

    <text x="60"
          y="345"
          fill="white"
          font-size="30"
          font-family="Arial"
          font-weight="700">

      All Tasks

    </text>

    <text x="60"
          y="380"
          fill="#94a3b8"
          font-size="16"
          font-family="Arial">

      View and manage all

    </text>

    <text x="60"
          y="405"
          fill="#94a3b8"
          font-size="16"
          font-family="Arial">

      course assignments

    </text>

    <!-- Arrow -->

    <circle cx="335"
            cy="430"
            r="25"
            fill="#00c6ff"
            opacity="0.15"
            stroke="#00c6ff"/>

    <text x="325"
          y="439"
          fill="#00c6ff"
          font-size="25">

      →

    </text>

  </g>


  <!-- ANNOUNCEMENTS -->

  <g>

    <rect x="435" y="230"
          width="330"
          height="260"
          rx="25"
          fill="#0b102b"
          stroke="#a855f7"
          stroke-width="2"
          filter="url(#glowPurple)"/>

    <circle cx="480"
            cy="275"
            r="28"
            fill="#a855f7"
            opacity="0.15"/>

    <text x="460"
          y="285"
          font-size="28">

      📢

    </text>

    <text x="435"
          y="345"
          fill="white"
          font-size="30"
          font-family="Arial"
          font-weight="700">

      Announcements

    </text>

    <text x="435"
          y="380"
          fill="#94a3b8"
          font-size="16"
          font-family="Arial">

      Stay updated with the

    </text>

    <text x="435"
          y="405"
          fill="#94a3b8"
          font-size="16"
          font-family="Arial">

      latest news and updates

    </text>

    <circle cx="710"
            cy="430"
            r="25"
            fill="#a855f7"
            opacity="0.15"
            stroke="#a855f7"/>

    <text x="700"
          y="439"
          fill="#c084fc"
          font-size="25">

      →

    </text>

  </g>


  <!-- RESOURCES -->

  <g>

    <rect x="810" y="230"
          width="330"
          height="260"
          rx="25"
          fill="#061d24"
          stroke="#22c55e"
          stroke-width="2"/>

    <circle cx="855"
            cy="275"
            r="28"
            fill="#22c55e"
            opacity="0.15"/>

    <text x="835"
          y="285"
          font-size="28">

      📚

    </text>

    <text x="810"
          y="345"
          fill="white"
          font-size="30"
          font-family="Arial"
          font-weight="700">

      Resources

    </text>

    <text x="810"
          y="380"
          fill="#94a3b8"
          font-size="16"
          font-family="Arial">

      Access study materials,

    </text>

    <text x="810"
          y="405"
          fill="#94a3b8"
          font-size="16"
          font-family="Arial">

      links and useful resources

    </text>

    <circle cx="1085"
            cy="430"
            r="25"
            fill="#22c55e"
            opacity="0.15"
            stroke="#22c55e"/>

    <text x="1075"
          y="439"
          fill="#4ade80"
          font-size="25">

      →

    </text>

  </g>


  <!-- FOOTER -->

  <line x1="250" y1="550"
        x2="450" y2="550"
        stroke="#0ea5e9"
        stroke-width="2"/>

  <text x="480"
        y="560"
        fill="#38bdf8"
        font-size="23"
        font-family="monospace">

    Better Systems

  </text>

  <text x="690"
        y="560"
        fill="#64748b"
        font-size="23">

    →

  </text>

  <text x="725"
        y="560"
        fill="#38bdf8"
        font-size="23"
        font-family="monospace">

    Better Future

  </text>

  <line x1="850" y1="550"
        x2="1050" y2="550"
        stroke="#0ea5e9"
        stroke-width="2"/>


  <!-- Animated Scan Line -->

  <rect x="50" y="220"
        width="4"
        height="280"
        fill="#22d3ee"
        opacity="0.7">

    <animate
      attributeName="x"
      from="50"
      to="1145"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>

</svg>
